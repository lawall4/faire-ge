<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="faire-ge is a minimal ocean-inspired business website with elegant typography and a calm, modern feel."
    />
    <title>faire-ge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <span class="orb orb-one"></span>
      <span class="orb orb-two"></span>
      <span class="grid"></span>
    </div>

    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Faire Ge home">
          <span class="brand-mark"><img id="brand-logo" src="logo.png" alt="faire-ge logo" /></span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="#values" id="nav-values"></a>
          <a href="#contact" id="nav-contact"></a>
        </nav>
      </header>

      <main id="home">
        <section class="hero">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="lede" id="hero-lede"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#contact" id="hero-primary-cta"></a>
            <a class="button button-secondary" href="#values" id="hero-secondary-cta"></a>
          </div>
        </section>

        <section id="values" class="card values">
          <p class="section-label" id="values-label"></p>
          <p id="values-body"></p>
        </section>

        <section id="contact" class="card contact">
          <div>
            <p class="section-label" id="contact-label"></p>
            <h2 id="contact-title"></h2>
          </div>
          <p id="contact-body"></p>
          <a class="button button-primary" href="mailto:hello@faire-ge.ie" id="contact-link"></a>
        </section>
      </main>

      <footer class="footer">
        <p id="footer-copyright"></p>
        <p id="footer-note"></p>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
